server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index app.html;

    location / {
        try_files $uri $uri/ /app.html;
    }

    # The TV reloads to pick up changes — never serve a stale shell or source.
    location ~* \.(?:html|jsx)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
